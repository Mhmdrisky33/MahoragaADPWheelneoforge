name: Build Mahoraga NeoForge 1.21.1
# Trigger build for corrected valid wheel textures

on:
  workflow_dispatch:
  push:
    branches: [ main, master, visual-gui-update ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build mod
        run: ./gradlew build --no-daemon

      - name: Upload mod JAR (if build succeeds)
        uses: actions/upload-artifact@v4
        with:
          name: mahoraga-neoforge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
